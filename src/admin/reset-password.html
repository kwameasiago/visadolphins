<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Visa Dolphins</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-card">
            <!-- Logo -->
            <div class="admin-logo">
                <div class="admin-logo__icon">
                    <svg width="44" height="44" viewBox="0 0 28 28" fill="none">
                        <circle cx="14" cy="14" r="13" stroke="#00bcd4" stroke-width="2"/>
                        <path d="M8 14c2-3 4-3 6 0s4 3 6 0" stroke="#00bcd4" stroke-width="2" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>
                <h1 class="admin-logo__title">Visa Dolphins</h1>
                <p class="admin-logo__subtitle">Reset Password</p>
            </div>

            <!-- Messages -->
            <div id="message" class="message"></div>

            <!-- Reset Form -->
            <form id="reset-form" class="admin-form">
                <div class="form-field">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" name="password" placeholder="Enter new password" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-field">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm new password" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary" id="reset-btn">Reset Password</button>
            </form>

            <div class="admin-links">
                <a href="/admin/">Back to login</a>
            </div>
        </div>
    </div>

    <script src="/admin/js/reset-password.js"></script>
</body>
</html>
