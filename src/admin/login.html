<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Visa Dolphins</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-card">
            <!-- Logo -->
            <div class="admin-logo">
                <div class="admin-logo__icon">
                    <svg width="44" height="44" viewBox="0 0 28 28" fill="none">
                        <circle cx="14" cy="14" r="13" stroke="#00bcd4" stroke-width="2"/>
                        <path d="M8 14c2-3 4-3 6 0s4 3 6 0" stroke="#00bcd4" stroke-width="2" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>
                <h1 class="admin-logo__title">Visa Dolphins</h1>
                <p class="admin-logo__subtitle">Admin Panel</p>
            </div>

            <!-- Messages -->
            <div id="message" class="message"></div>

            <!-- Login Form -->
            <form id="login-form" class="admin-form">
                <div class="form-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">Sign In</button>
            </form>

            <!-- Forgot password link -->
            <div class="admin-links">
                <a href="#" id="forgot-link">Forgot password?</a>
            </div>

            <!-- Forgot password section (inline) -->
            <div id="forgot-section" class="forgot-section">
                <h3>Reset Your Password</h3>
                <div id="forgot-message" class="message"></div>
                <form id="forgot-form" class="admin-form">
                    <div class="form-field">
                        <label for="reset-email">Email Address</label>
                        <input type="email" id="reset-email" name="email" placeholder="Enter your admin email" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="forgot-btn">Send Reset Link</button>
                </form>
                <div id="reset-link-display" class="reset-link-display">
                    <p>Reset link (dev only — will be emailed in production):</p>
                    <code id="reset-link-value"></code>
                </div>
                <div class="admin-links" style="margin-top: 1rem;">
                    <a href="#" id="back-to-login">Back to login</a>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="/admin/js/toast.js"></script>
    <script src="/admin/js/login.js"></script>
</body>
</html>
