<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post — Admin — Visa Dolphins</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
</head>
<body class="admin-page">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
        <a href="/admin/" class="admin-sidebar__brand">
            <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
                <circle cx="14" cy="14" r="13" stroke="#00bcd4" stroke-width="2"/>
                <path d="M8 14c2-3 4-3 6 0s4 3 6 0" stroke="#00bcd4" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
            Visa Dolphins
        </a>
        <nav class="admin-sidebar__nav">
            <a href="/admin/">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                Dashboard
            </a>
            <a href="/admin/athletes.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Athletes
            </a>
            <a href="/admin/news-events.html" class="active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                News & Events
            </a>
            <a href="/admin/equipment.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                Equipment
            </a>
        </nav>
        <div class="admin-sidebar__footer">
            <button class="admin-sidebar__logout" id="logout-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
            </button>
        </div>
    </aside>

    <!-- Mobile overlay -->
    <div class="admin-overlay" id="admin-overlay"></div>

    <!-- Main content -->
    <div class="admin-main">
        <header class="admin-mobile-header">
            <a href="/admin/" class="admin-mobile-header__brand">
                <svg width="20" height="20" viewBox="0 0 28 28" fill="none">
                    <circle cx="14" cy="14" r="13" stroke="#00bcd4" stroke-width="2"/>
                    <path d="M8 14c2-3 4-3 6 0s4 3 6 0" stroke="#00bcd4" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
                Visa Dolphins
            </a>
            <button class="admin-hamburger" id="admin-hamburger">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </header>

        <div class="admin-page-container">
            <div class="admin-header" style="margin-bottom:1.5rem;">
                <div>
                    <a href="/admin/news-events.html" style="display:inline-flex;align-items:center;gap:0.35rem;font-size:0.8rem;color:var(--color-text-muted);margin-bottom:0.5rem;">&larr; Back to News & Events</a>
                    <h1 id="page-title">Add Post</h1>
                </div>
            </div>

            <div id="message" class="message"></div>

            <form id="post-form" class="admin-form ne-edit-form" enctype="multipart/form-data">
                <input type="hidden" id="form-public-id" value="">

                <!-- Content section -->
                <div class="ne-edit-section">
                    <h2 class="ne-edit-section__title">Content</h2>
                    <div class="form-field">
                        <label for="form-title">Title *</label>
                        <input type="text" id="form-title" placeholder="Enter post title" required>
                    </div>
                    <div class="form-field">
                        <label>Body</label>
                        <div id="quill-editor"></div>
                    </div>
                    <div class="form-field" style="margin-top:1rem;">
                        <label class="ne-star-toggle">
                            <input type="checkbox" id="form-star">
                            <span class="ne-star-toggle__icon">★</span>
                            <span>Show on homepage (starred)</span>
                        </label>
                    </div>
                </div>

                <!-- Media section -->
                <div class="ne-edit-section">
                    <h2 class="ne-edit-section__title">Media</h2>
                    <p style="font-size:0.8rem;color:var(--color-text-muted);margin-bottom:1rem;">Add images, videos, or YouTube links. Mark one as the thumbnail for cards.</p>

                    <!-- Existing media (shown on edit) -->
                    <div id="existing-media" class="ne-media-grid"></div>

                    <!-- Add new media -->
                    <div id="new-media-list" class="ne-media-add-list"></div>

                    <div class="ne-media-add-actions">
                        <button type="button" class="btn btn-outline btn-sm" id="add-image-btn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            Add Image
                        </button>
                        <button type="button" class="btn btn-outline btn-sm" id="add-video-btn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                            Add Video
                        </button>
                        <button type="button" class="btn btn-outline btn-sm" id="add-youtube-btn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19.13C5.12 19.56 12 19.56 12 19.56s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.43z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></svg>
                            Add YouTube
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <div class="ne-edit-actions">
                    <a href="/admin/news-events.html" class="btn btn-outline">Cancel</a>
                    <button type="submit" class="btn btn-primary" id="form-submit-btn">Save Post</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <script src="/admin/js/news-event-edit.js"></script>
</body>
</html>
