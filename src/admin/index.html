<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Admin — Visa Dolphins</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin-page">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
        <a href="/admin/" class="admin-sidebar__brand">
            <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
                <circle cx="14" cy="14" r="13" stroke="#00bcd4" stroke-width="2"/>
                <path d="M8 14c2-3 4-3 6 0s4 3 6 0" stroke="#00bcd4" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
            Visa Dolphins
        </a>
        <nav class="admin-sidebar__nav">
            <a href="/admin/" class="active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                Dashboard
            </a>
            <a href="/admin/athletes.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Athletes
            </a>
        </nav>
        <div class="admin-sidebar__footer">
            <button class="admin-sidebar__logout" id="logout-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
            </button>
        </div>
    </aside>

    <!-- Mobile overlay -->
    <div class="admin-overlay" id="admin-overlay"></div>

    <!-- Main content -->
    <div class="admin-main">
        <!-- Mobile header -->
        <header class="admin-mobile-header">
            <a href="/admin/" class="admin-mobile-header__brand">
                <svg width="20" height="20" viewBox="0 0 28 28" fill="none">
                    <circle cx="14" cy="14" r="13" stroke="#00bcd4" stroke-width="2"/>
                    <path d="M8 14c2-3 4-3 6 0s4 3 6 0" stroke="#00bcd4" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
                Visa Dolphins
            </a>
            <button class="admin-hamburger" id="admin-hamburger">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </header>

        <div class="admin-page-container">
            <div class="admin-header">
                <h1>Dashboard</h1>
            </div>

            <!-- To-do section -->
            <div class="dashboard-section">
                <h2 class="dashboard-section__title">To Do</h2>
                <div class="todo-list" id="todo-list">
                    <div class="todo-item">
                        <input type="checkbox" class="todo-checkbox" id="todo-1">
                        <label for="todo-1" class="todo-label">Add athlete profiles with images and personal bests</label>
                    </div>
                    <div class="todo-item">
                        <input type="checkbox" class="todo-checkbox" id="todo-2">
                        <label for="todo-2" class="todo-label">Mark star athletes for homepage featured section</label>
                    </div>
                    <div class="todo-item">
                        <input type="checkbox" class="todo-checkbox" id="todo-3">
                        <label for="todo-3" class="todo-label">Upload high-quality athlete photos</label>
                    </div>
                    <div class="todo-item">
                        <input type="checkbox" class="todo-checkbox" id="todo-4">
                        <label for="todo-4" class="todo-label">Add sports equipment inventory</label>
                    </div>
                    <div class="todo-item">
                        <input type="checkbox" class="todo-checkbox" id="todo-5">
                        <label for="todo-5" class="todo-label">Create news &amp; event announcements</label>
                    </div>
                </div>
            </div>

            <!-- Quick links -->
            <div class="dashboard-section">
                <h2 class="dashboard-section__title">Quick Links</h2>
                <div class="dashboard-links">
                    <a href="/admin/athletes.html" class="dashboard-link-card">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        <span>Manage Athletes</span>
                    </a>
                    <a href="/" class="dashboard-link-card" target="_blank">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                        <span>View Website</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="/admin/js/dashboard.js"></script>
</body>
</html>
