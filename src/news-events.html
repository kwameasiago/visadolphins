<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News & Events — Visa Dolphins Swimming Club</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Header -->
    <div id="site-header"></div>

    <main id="main-content">
        <section class="page-hero">
            <div class="container">
                <h1 class="page-hero__title">News & Events</h1>
                <p class="page-hero__subtitle">Stay up to date with the latest from Visa Dolphins</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="news-controls">
                    <div class="search-bar">
                        <input type="text" id="search-input" placeholder="Search news..." class="search-bar__input">
                    </div>
                </div>

                <div id="news-grid" class="news-grid"></div>

                <div id="empty-state" class="empty-state" style="display:none;">
                    <p>No posts found.</p>
                </div>

                <div id="pagination" class="pagination"></div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="site-footer"></div>

    <script src="/js/main.js"></script>
    <script src="/js/news-events.js"></script>
</body>
</html>
