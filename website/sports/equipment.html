<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Visa Dolphins Sports — Professional swimming equipment, competitive gear, and training accessories.">
    <title>Sports Equipment — Visa Dolphins Sports</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="site-header"></div>

    <main>
        <!-- ===========================
             PAGE HERO
             =========================== -->
        <section class="page-hero">
            <div class="container">
                <span class="hero-badge">VISA DOLPHINS SPORTS</span>
                <h1 class="page-hero__title">Sports <span class="text-accent">Equipment</span></h1>
                <p class="page-hero__desc">Professional swimming gear for athletes, clubs, and schools. Quality equipment to train with purpose and equip with confidence.</p>
            </div>
        </section>

        <!-- ===========================
             SEARCH + EQUIPMENT GRID
             =========================== -->
        <section class="section">
            <div class="container">
                <div class="equipment-search-bar">
                    <input type="text" id="equipment-search" placeholder="Search equipment..." class="equipment-search-input">
                </div>
                <div id="equipment-grid" class="equipment-grid"></div>
                <div id="equipment-empty" style="display:none;text-align:center;padding:3rem 1rem;color:var(--color-text-muted);">
                    <p>No equipment found.</p>
                </div>
                <div id="equipment-pagination" class="pagination" style="margin-top:2rem;"></div>
            </div>
        </section>

        <!-- ===========================
             CTA
             =========================== -->
        <section class="section">
            <div class="container" style="text-align: center;">
                <p style="color: var(--color-text-muted); margin-bottom: 1.5rem;">Looking for something else? Let us know what you need and we'll source it for you.</p>
                <a href="https://wa.me/254700000000?text=Hi%2C%20I%27m%20looking%20for%20specific%20swimming%20equipment" target="_blank" class="btn btn-primary">Enquire via WhatsApp</a>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>
    <script src="/js/config.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/equipment.js"></script>
</body>
</html>
