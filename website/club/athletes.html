<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Meet the athletes of Visa Dolphins Swim Club — county, national, and international competitors.">
    <title>Athletes — Visa Dolphins Swim Club</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="site-header"></div>

    <main>
        <!-- ===========================
             PAGE HERO
             =========================== -->
        <section class="page-hero">
            <div class="container">
                <span class="hero-badge">VISA DOLPHINS ATHLETES</span>
                <h1 class="page-hero__title">Meet Our <span class="text-accent">Athletes</span></h1>
                <p class="page-hero__desc">From beginners to national team representatives — our swimmers compete at county, national, and international level. Every champion started with a single stroke.</p>
            </div>
        </section>

        <!-- ===========================
             SEARCH
             =========================== -->
        <section class="section" style="padding-bottom: 0;">
            <div class="container">
                <div style="max-width: 400px;">
                    <input type="text" id="athlete-search" placeholder="Search athletes by name..." style="width:100%;padding:0.75rem 1rem;background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-text);font-size:0.95rem;">
                </div>
            </div>
        </section>

        <!-- ===========================
             ATHLETES GRID (dynamic)
             =========================== -->
        <section class="section">
            <div class="container">
                <div id="athletes-grid" class="athletes-grid"></div>
                <div id="athletes-empty" style="display:none;text-align:center;padding:4rem 2rem;color:var(--color-text-muted);">
                    <p style="font-size:1.1rem;font-weight:600;color:var(--color-text-heading);margin-bottom:0.5rem;">No athletes to display</p>
                    <p style="font-size:0.85rem;">Check back soon for updates.</p>
                </div>
                <div id="athletes-pagination" style="display:flex;align-items:center;justify-content:center;gap:0.5rem;margin-top:2rem;"></div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>
    <script src="/js/config.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/athletes.js"></script>
</body>
</html>
