<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Admin — Visa Dolphins</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body class="admin-page">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
        <a href="/" class="admin-sidebar__brand">
            <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
                <circle cx="14" cy="14" r="13" stroke="#00bcd4" stroke-width="2"/>
                <path d="M8 14c2-3 4-3 6 0s4 3 6 0" stroke="#00bcd4" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
            Visa Dolphins
        </a>
        <nav class="admin-sidebar__nav">
            <a href="/" class="active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                Dashboard
            </a>
            <a href="/athletes.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Athletes
            </a>
            <a href="/news-events.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                News & Events
            </a>
            <a href="/equipment.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                Equipment
            </a>
            <a href="/gallery.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                Gallery
            </a>
            <a href="/contact-submissions.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                Messages
            </a>
            <a href="/applications.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                Applications
            </a>
        </nav>
        <div class="admin-sidebar__footer">
            <button class="admin-sidebar__logout" id="logout-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
            </button>
        </div>
    </aside>

    <!-- Mobile overlay -->
    <div class="admin-overlay" id="admin-overlay"></div>

    <!-- Main content -->
    <div class="admin-main">
        <!-- Mobile header -->
        <header class="admin-mobile-header">
            <a href="/" class="admin-mobile-header__brand">
                <svg width="20" height="20" viewBox="0 0 28 28" fill="none">
                    <circle cx="14" cy="14" r="13" stroke="#00bcd4" stroke-width="2"/>
                    <path d="M8 14c2-3 4-3 6 0s4 3 6 0" stroke="#00bcd4" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
                Visa Dolphins
            </a>
            <button class="admin-hamburger" id="admin-hamburger">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </header>

        <div class="admin-page-container">
            <div class="admin-header">
                <h1>Dashboard</h1>
            </div>

            <!-- Stat cards -->
            <div class="dash-stats-grid" id="dashboard-stats">
                <a href="/contact-submissions.html" class="dash-stat-card">
                    <div class="dash-stat-card__icon dash-stat-card__icon--messages">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </div>
                    <div class="dash-stat-card__body">
                        <span class="dash-stat-card__value" id="stat-unread-messages">—</span>
                        <span class="dash-stat-card__label">Unread Messages</span>
                    </div>
                    <span class="dash-stat-card__total" id="stat-total-messages"></span>
                </a>
                <a href="/applications.html" class="dash-stat-card">
                    <div class="dash-stat-card__icon dash-stat-card__icon--applications">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                    </div>
                    <div class="dash-stat-card__body">
                        <span class="dash-stat-card__value" id="stat-new-applications">—</span>
                        <span class="dash-stat-card__label">New Applications</span>
                    </div>
                    <span class="dash-stat-card__total" id="stat-total-applications"></span>
                </a>
                <a href="/athletes.html" class="dash-stat-card">
                    <div class="dash-stat-card__icon dash-stat-card__icon--athletes">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </div>
                    <div class="dash-stat-card__body">
                        <span class="dash-stat-card__value" id="stat-athletes">—</span>
                        <span class="dash-stat-card__label">Athletes</span>
                    </div>
                </a>
                <a href="/news-events.html" class="dash-stat-card">
                    <div class="dash-stat-card__icon dash-stat-card__icon--news">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    </div>
                    <div class="dash-stat-card__body">
                        <span class="dash-stat-card__value" id="stat-news-events">—</span>
                        <span class="dash-stat-card__label">News & Events</span>
                    </div>
                </a>
                <a href="/equipment.html" class="dash-stat-card">
                    <div class="dash-stat-card__icon dash-stat-card__icon--equipment">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                    </div>
                    <div class="dash-stat-card__body">
                        <span class="dash-stat-card__value" id="stat-equipment">—</span>
                        <span class="dash-stat-card__label">Equipment</span>
                    </div>
                </a>
                <a href="/gallery.html" class="dash-stat-card">
                    <div class="dash-stat-card__icon dash-stat-card__icon--gallery">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    </div>
                    <div class="dash-stat-card__body">
                        <span class="dash-stat-card__value" id="stat-gallery">—</span>
                        <span class="dash-stat-card__label">Gallery Images</span>
                    </div>
                </a>
            </div>

            <!-- Applications trend chart -->
            <div class="dashboard-section">
                <div class="dash-chart-header">
                    <h2 class="dashboard-section__title">Applications Trend</h2>
                    <div class="dash-chart-filters">
                        <label>From <input type="date" id="chart-from"></label>
                        <label>To <input type="date" id="chart-to"></label>
                        <button class="btn btn-sm btn-primary" id="chart-filter-btn">Apply</button>
                    </div>
                </div>
                <div class="dash-chart-wrapper">
                    <canvas id="applications-chart"></canvas>
                </div>
            </div>

            <!-- Quick links -->
            <div class="dashboard-section">
                <h2 class="dashboard-section__title">Quick Links</h2>
                <div class="dashboard-links">
                    <a href="/athletes.html" class="dashboard-link-card">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        <span>Manage Athletes</span>
                    </a>
                    <a href="/" class="dashboard-link-card" target="_blank">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                        <span>View Website</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
